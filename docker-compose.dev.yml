# LOCAL DEVELOPMENT ONLY: runs just Postgres + Redis so you can run the app with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: sipvault-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sipvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipvault}
      POSTGRES_DB: ${POSTGRES_DB:-sipvault}
    ports:
      - "5432:5432"
    volumes:
      - dev_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dev_pg:
