# CI/CD
#  - every push / PR: install + build (catches type and build errors)
#  - push to main: SSH into the server, pull the code, rebuild and restart containers
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST     public IP / hostname of the server
#   SERVER_USER     SSH user (e.g. ubuntu)
#   SERVER_SSH_KEY  private key that can SSH into the server
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-only
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/sipvault
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
